  <style>
    .reward-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    .reward-table th { background:linear-gradient(90deg,rgba(212,168,32,0.2),rgba(212,168,32,0.08)); color:var(--gold-dim); font-family:'Cinzel',serif; font-size:0.68rem; letter-spacing:0.12em; padding:10px 16px; border:1px solid #2a1f40; text-align:left; }
    .reward-table td { background:#0e0a1c; padding:10px 16px; border:1px solid #1e1630; color:var(--text-dim); }
    .reward-table tr:nth-child(even) td { background:#100c1e; }
    .reward-table tr:hover td { background:#16102a; }
    .reward-table td:first-child { color:var(--text-bright); }

    /* 規則框 */
    .rule-box { background:#080d08; border:1px solid #1e3d1e; border-radius:4px; padding:14px 18px; margin-bottom:22px; }
    .rule-box ul { margin:0; padding-left:20px; color:#81c784; font-weight:600; line-height:2; font-size:0.88rem; }
    .rule-box ul b { color:#a5d6a7; }

    /* 廣播標籤 */
    .broadcast-tag { background:#2a1e00; color:#ffa726; border:1px solid #f9a825; padding:2px 8px; border-radius:4px; font-size:0.75em; margin-left:8px; vertical-align:middle; display:inline-block; animation:flash 1.5s infinite; font-family:'Cinzel',serif; }
    @keyframes flash { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* 機率徽章 */
    .prob-badge { padding:2px 9px; border-radius:12px; font-weight:700; font-size:0.82em; display:inline-block; font-family:'Cinzel',serif; }
    .prob-red    { background:rgba(239,83,80,.15); color:#ef5350; }
    .prob-orange { background:rgba(255,152,0,.15); color:#ffa726; }
    .prob-blue   { background:rgba(100,181,246,.15); color:#64b5f6; }
    .prob-green  { background:rgba(76,175,80,.15); color:#66bb6a; }
    .prob-dim    { background:rgba(255,255,255,.08); color:#8c7a9e; }
    .prob-gold   { background:rgba(255,45,120,.2); color:#c9a96e; }
    .prob-purple { background:rgba(147,52,230,.2); color:#ce93d8; }

    /* 徽章名稱顏色 */
    .badge-default { color:var(--text-bright); font-weight:700; }
    .badge-green  { color:#66bb6a; font-weight:700; }
    .badge-blue   { color:#64b5f6; font-weight:700; }
    .badge-purple { color:#ce93d8; font-weight:700; }
    .badge-red    { color:#ef5350; font-weight:700; }
    .badge-orange { color:#ffa726; font-weight:700; }
    .badge-gold   { color:#c9a96e; font-weight:700; }

    /* NPC 卡 */
    .npc-card { display:flex; gap:24px; align-items:center; flex-wrap:wrap; background:#060814; border:1px solid rgba(100,181,246,0.3); border-radius:4px; padding:24px; margin-bottom:28px; }
    .npc-info { flex:1; min-width:200px; }
    .npc-name { display:block; font-size:1.3rem; font-weight:900; color:#90caf9; margin-bottom:8px; font-family:'Noto Serif TC',serif; }
    .npc-description { font-size:0.9rem; color:var(--text-dim); margin-bottom:12px; line-height:1.7; }
    .npc-tags { display:flex; gap:8px; flex-wrap:wrap; }
    .npc-tag { background:rgba(25,118,210,0.3); color:#90caf9; border:1px solid rgba(100,181,246,0.4); padding:4px 12px; border-radius:4px; font-size:0.82rem; font-weight:700; font-family:'Cinzel',serif; }

    /* PVP 卡 */
    .pvp-card { background:#0c0c00; border:1px solid rgba(249,168,37,0.5); border-radius:4px; padding:20px 22px; margin-bottom:28px; position:relative; }
    .pvp-tag { display:inline-block; background:#f9a825; color:#1a0e00; padding:2px 12px; border-radius:12px; font-weight:700; font-size:0.82em; margin-bottom:14px; font-family:'Cinzel',serif; }
    .buff-group { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
    .buff-item { background:#1a1400; border:1px solid rgba(249,168,37,0.35); padding:6px 14px; border-radius:4px; font-weight:700; font-size:0.88em; color:#ffd54f; }
    .buff-item--blue { color:#90caf9; border-color:rgba(100,181,246,0.35); background:#0a1020; }
    .buff-item--purple { color:#ce93d8; border-color:rgba(147,52,230,0.35); background:#120a1e; }
    .buff-item--red { color:#ef9a9a; border-color:rgba(239,83,80,0.35); background:#1a0808; }

    /* 表格容器 */
    .table-wrap { overflow-x:auto; border:1px solid #2a1f40; border-radius:4px; margin-bottom:28px; }
  </style>
