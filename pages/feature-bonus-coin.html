  <style>
    /* === VIP Table === */
    .bonus-vip-table { width:100%; border-collapse:collapse; font-size:0.82rem; margin-bottom:40px; }
    .bonus-vip-table th { background: linear-gradient(90deg, rgba(212,168,32,0.2) 0%, rgba(212,168,32,0.08) 100%); color:var(--gold-dim); font-family:'Cinzel',serif; font-size:0.68rem; letter-spacing:0.12em; padding:10px 14px; border:1px solid #2a1f40; text-align:left; }
    .bonus-vip-table td { background:#0e0a1c; padding:10px 14px; border:1px solid #1e1630; color:var(--text-dim); }
    .bonus-vip-table tr:nth-child(even) td { background:#100c1e; }
    .bonus-vip-table tr:hover td { background:#16102a; }
    .bonus-vip-table td:first-child { color:var(--text-bright); font-weight:700; white-space:nowrap; }
    .bonus-vip-table td:nth-child(2) { color:#ffe060; font-family:'Cinzel',serif; font-weight:700; }
    .bonus-vip-max td { background:#1c1030 !important; border-color:rgba(212,168,32,0.45) !important; }
    .bonus-vip-max td:first-child { color:#ffe060; text-shadow:0 0 8px rgba(255,224,96,0.5); font-size:0.9rem; }
    .bonus-exp { color:#4db6ac; font-weight:700; }
    .bonus-stat { color:#ff8a65; font-weight:700; }
    .bonus-def { color:#ff8080; font-weight:700; }

    /* === Shop Grid === */
    .bonus-shop-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:18px; margin-bottom:40px; }
    .bonus-shop-card { background:#120e24; border:1px solid #2a1f40; border-radius:4px; padding:24px 20px; text-align:center; transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
    .bonus-shop-card:hover { border-color:var(--gold); transform:translateY(-4px); box-shadow:0 6px 20px rgba(0,0,0,0.5); }
    .bonus-shop-card--premium { border-color:rgba(212,168,32,0.4); box-shadow:0 0 12px rgba(212,168,32,0.15); }
    .bonus-shop-card--premium:hover { box-shadow:0 0 24px rgba(212,168,32,0.35), 0 6px 20px rgba(0,0,0,0.5); }
    .bonus-shop-name { color:var(--text-bright); font-size:1rem; font-weight:700; margin-bottom:12px; line-height:1.4; }
    .bonus-shop-price { font-family:'Cinzel',serif; font-size:1.4rem; font-weight:700; color:#ffe060; line-height:1.2; }
    .bonus-shop-unit { display:block; font-size:0.7rem; color:var(--gold-dim); letter-spacing:0.1em; margin-top:4px; }

    .bonus-hint { background:#1c1030; border-left:3px solid var(--gold); padding:16px 20px; color:var(--text-bright); font-size:0.9rem; margin-top:8px; }
  </style>
