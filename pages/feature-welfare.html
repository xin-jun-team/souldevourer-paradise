  <style>
    .welfare-hero-box {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 32px 36px;
      margin-bottom: 36px;
      background: linear-gradient(135deg, #1a0a08 0%, #2a0c14 40%, #1a0818 100%);
      border: 1px solid #4a2030;
      position: relative;
      overflow: hidden;
    }
    .welfare-hero-box::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #ff4444, #ffcc00, #ff4444, transparent);
    }
    .welfare-hero-icon-wrap {
      flex-shrink: 0;
      width: 100px; height: 100px;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle, rgba(255,100,100,0.15) 0%, transparent 70%);
      border: 1px solid #4a2030;
      border-radius: 8px;
      position: relative;
    }
    .welfare-hero-icon-wrap::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 10px;
      background: radial-gradient(circle, rgba(255,200,60,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .welfare-hero-icon {
      width: 56px; height: 56px;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 12px rgba(255,200,60,0.5));
    }
    .welfare-hero-text { flex: 1; }
    .welfare-hero-amount {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      color: #ff6666;
      text-shadow: 0 0 24px rgba(255,102,102,0.4);
      line-height: 1.2;
    }
    .welfare-hero-amount span {
      color: #ffe060;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.75em;
    }
    .welfare-hero-sub {
      font-size: 1rem;
      color: #ffcc88;
      letter-spacing: 0.1em;
      margin-top: 8px;
    }
    @media (max-width: 520px) {
      .welfare-hero-box { flex-direction: column; text-align: center; padding: 28px 20px; }
    }
    .welfare-rule-card {
      background: #120808;
      border: 1px solid #3a1818;
      padding: 20px 24px;
      margin-bottom: 12px;
    }
    .welfare-rule-card strong { color: #ff6666; }
    .welfare-rule-list { list-style: none; padding: 0; margin: 0; }
    .welfare-rule-list li {
      font-size: 0.88rem;
      color: #e0c0a0;
      line-height: 2;
      padding-left: 18px;
      position: relative;
    }
    .welfare-rule-list li::before {
      content: '▸';
      position: absolute; left: 0;
      color: #ff4444;
    }
  </style>
